menu:
  title: "SSBot 帮助菜单"
  subtitle: "回复分类名查看详细命令"

  categories:
    - id: comic
      label: "漫画工具"
      style: primary
      permission: user
      items:
        - id: jm_download
          label: "/jm 下载漫画"
          type: command
          action: "jm"
          permission: user
        - id: jm_search
          label: "/jm_search 搜索并选择"
          type: command
          action: "jm_search"
          permission: user

    - id: sv
      label: "影之诗查卡"
      style: success
      permission: user
      items:
        - id: sv_search
          label: "/sv <关键词> 模糊搜索"
          type: command
          action: "sv"
          permission: user
        - id: sv_class
          label: "/sv #<职业> 按职业过滤"
          type: command
          action: "sv #精灵"
          permission: user
        - id: sv_id
          label: "/sv !<ID> 查单卡（含卡图）"
          type: command
          action: "sv !10001110"
          permission: user

    - id: games
      label: "娱乐"
      style: success
      permission: user
      items:
        - id: tic_tac_toe
          label: "/井字棋 人机对弈"
          type: command
          action: "井字棋"
          permission: user
        - id: qinghua
          label: "/情话 随机情话"
          type: command
          action: "情话"
          permission: user

    - id: coc
      label: "跑团（CoC）"
      style: primary
      permission: user
      items:
        - id: coc_start
          label: "/coc 开团 开局（管理员）"
          type: command
          action: "coc 开团"
          permission: admin
        - id: coc_create
          label: "/coc 车卡 车卡向导（点数/快速/随机）"
          type: command
          action: "coc 车卡"
          permission: user
        - id: coc_act
          label: "/coc 行动 <做什么>"
          type: command
          action: "coc 行动 我检查那封信"
          permission: user
        - id: coc_scene
          label: "/coc 场景 当前场景与出口"
          type: command
          action: "coc 场景"
          permission: user
        - id: coc_clues
          label: "/coc 线索 已发现线索"
          type: command
          action: "coc 线索"
          permission: user
        - id: coc_check
          label: "/coc 检定 <技能> 掷一次检定"
          type: command
          action: "coc 检定 侦查"
          permission: user
        - id: coc_state
          label: "/coc 状态 查看角色卡"
          type: command
          action: "coc 状态"
          permission: user
        - id: coc_attack
          label: "/coc 攻击 <目标> [武器]"
          type: command
          action: "coc 攻击 老陈 小刀"
          permission: user
        - id: coc_sanity
          label: "/coc 理智 1/1d6 理智检定"
          type: command
          action: "coc 理智 1/1d6"
          permission: user
        - id: coc_replay
          label: "/coc 复盘 生成本局战报"
          type: command
          action: "coc 复盘"
          permission: user
        - id: coc_stop
          label: "/coc 结束 结束本局（管理员）"
          type: command
          action: "coc 结束"
          permission: admin

    - id: system
      label: "信息与系统"
      style: warning
      permission: user
      items:
        - id: group_list
          label: "/get_list 查看群信息"
          type: command
          action: "get_list"
          permission: user
        - id: whoami
          label: "/whoami 我是谁"
          type: command
          action: "whoami"
          permission: user
        - id: help_reload
          label: "/help_reload 重载菜单（管理员）"
          type: command
          action: "help_reload"
          permission: admin

    - id: ai
      label: "AI 管理"
      style: warning
      permission: admin
      items:
        - id: choose_prompt
          label: "/choose_prompt 切换人格"
          type: command
          action: "choose_prompt"
          permission: admin
        - id: prompt
          label: "/prompt 自定义提示词"
          type: command
          action: "prompt"
          permission: admin
        - id: insights
          label: "/insights 查看 Token 用量"
          type: command
          action: "insights"
          permission: admin

permissions:
  admins: []
  vip_users: []
  banned_users: []
